name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    # The name is load-bearing, not cosmetic: it is the check-run context
    # .github/branch-protection.json requires by exact string. Changing it
    # without changing that file leaves main waiting forever for a check
    # that no longer reports under the old name.
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev]
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src
      - run: python -m pytest -x -q
      # Named separately from the main pytest run above because this file is
      # what the build exists to defend (no import of interlock's internals
      # from anywhere under cadenza). It has to show up as its own line in
      # the log and fail loudly if the test file is ever emptied or moved,
      # rather than passing silently as one line among many in "pytest -x -q".
      - name: import boundary check (no interlock edge)
        run: python -m pytest tests/test_import_boundaries.py

  # Repo hygiene jobs below are deliberately not listed in
  # .github/branch-protection.json required checks; adding them there is a
  # separate, explicit decision (that file records intent and is not touched
  # by hygiene changes).
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck is preinstalled on the ubuntu runner image.
      - name: shellcheck all tracked *.sh files
        run: git ls-files '*.sh' | xargs --no-run-if-empty shellcheck

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev] pip-audit
      # Audit the installed environment (project runtime + dev deps).
      # --skip-editable excludes the local editable cadenza install itself.
      # This job fails on known vulnerabilities; an unfixable CVE would be
      # ignored explicitly via --ignore-vuln with a reason comment here.
      - name: pip-audit installed environment
        run: python -m pip_audit --skip-editable
