name: typescript

# The gate. This was deliberately a SEPARATE workflow from `tests.yml`, which
# was the Python suite's, on the reasoning that the two had different matrices,
# different toolchains and different lifetimes -- the Python jobs to be retired
# when `src/cadenza/` was (DECISIONS.md D-0014). That happened in D-0032:
# `tests.yml` is gone, and this file is now the whole of the merge gate. The
# separation did its job on the way out, which is why `.github/branch-protection.json`
# needed one context swapped rather than a rewrite.
#
# The merge gate for this half is the `ts-gate` job at the bottom. Read that
# first: everything above it exists to give it something to aggregate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: typescript-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  double-green:
    # Matrix leg names embed the matrix values, so this name is NOT the one the
    # ruleset references -- see `ts-gate`.
    name: double-green (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # The suite is pure in-process computation over a few hundred bytes per
    # case; a whole double run is under a second of test time on a laptop. The
    # cap is a floor under runner variance and install time, not a budget to
    # grow into: if a belt needs it raised, the cap is not the fix.
    timeout-minutes: 15
    strategy:
      # A red cell must not hide the state of the others: which cells failed is
      # the diagnosis, and cancelling them destroys it.
      fail-fast: false
      matrix:
        # The same three operating systems the Python suite ran on. Windows is
        # a required cell from day one rather than a nightly extra: the cp932
        # console is where the ASCII-only output policy is actually observed
        # (D-0007), and path handling is where a port from `os.path` goes wrong.
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Node 22 (Maintenance LTS) and Node 24 (Active LTS), matching the
        # `engines` range in package.json.
        node: ["22", "24"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install from the lockfile
        # `npm ci`, never `npm install`: it fails when package.json and
        # package-lock.json disagree, so a dependency cannot drift into a run
        # without appearing in a diff. `--ignore-scripts` is the standing rule
        # (D-0004), not a reaction to a particular package.
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npm run typecheck

      - name: Derive two distinct seeds for this cell
        id: seeds
        shell: bash
        run: |
          set -euo pipefail
          # Derived from the run id, the attempt, and the cell coordinates, so
          # that (a) every cell uses different seeds, (b) a re-run of the same
          # commit exercises different orders rather than replaying the one that
          # happened to be green, and (c) both seeds are printed and therefore
          # replayable.
          cell="${{ matrix.os }}-${{ matrix.node }}"
          mix=$(printf '%s' "$cell" | cksum | cut -d' ' -f1)
          run_id="${{ github.run_id }}"
          attempt="${{ github.run_attempt }}"
          seed_a=$(( (run_id + mix + attempt * 7919) % 2147483647 ))
          seed_b=$(( (seed_a * 31 + 1013904223) % 2147483647 ))
          # The rule is *distinct* seeds. Equality is astronomically unlikely and
          # is still handled, because "two runs at the same seed" is precisely
          # the degenerate case that would void the double-green guarantee.
          if [ "$seed_a" -eq "$seed_b" ]; then
            seed_b=$(( (seed_b + 1) % 2147483647 ))
          fi
          echo "seed_a=$seed_a" >> "$GITHUB_OUTPUT"
          echo "seed_b=$seed_b" >> "$GITHUB_OUTPUT"
          echo "cell=$cell seed_a=$seed_a seed_b=$seed_b"

      - name: Green 1 of 2 (seed ${{ steps.seeds.outputs.seed_a }})
        env:
          CADENZA_TEST_SEED: ${{ steps.seeds.outputs.seed_a }}
        # Shuffle itself is configured in vitest.config.ts and is NOT passed on
        # the command line: a CLI flag can be dropped by an edit to this file
        # without any test turning red, which would silently retire the rule
        # (D-0006). CI injects the seed and nothing else.
        run: npm test

      - name: Green 2 of 2 (seed ${{ steps.seeds.outputs.seed_b }})
        # No `if:` guard -- this step is reached only when the first run passed,
        # which is the serial half of the rule. Two green runs at two distinct
        # seeds in the same cell is what "green twice under random ordering"
        # means here.
        env:
          CADENZA_TEST_SEED: ${{ steps.seeds.outputs.seed_b }}
        run: npm test

  checks:
    # Lint, dead-export analysis and the parity machinery are all
    # platform-independent text checks, so one cell is enough; running them in
    # every matrix cell would only multiply an identical answer. The result
    # still gates the merge -- see `ts-gate`.
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Lint and format
        run: npm run lint

      - name: Unused exports and dependencies
        run: npm run knip

      - name: Parity ledger
        # A ledger nobody checks is a spreadsheet. This is the check.
        run: npm run parity

      - name: Source inventory
        run: npm run inventory

      - name: import boundary check (no interlock edge)
        # Named separately for the reason `tests.yml` used to record about the
        # Python half: this file is what the build exists to defend, so it gets
        # its own line in the log rather than passing as one of 386 in
        # `npm test`. It has already run there -- twice per cell, under the
        # shuffle -- so this step is visibility, not coverage.
        #
        # The seed is explicit because `CI` is set here and an unset seed under
        # CI is a hard error by design (D-0006). A fixed value is right for this
        # step and wrong for the suite: 95 filesystem-and-parser cases share no
        # state, so ordering proves nothing, and the double-green job is where
        # order is actually exercised.
        env:
          CADENZA_TEST_SEED: "1"
        run: npx vitest run test/architecture/import-boundaries.test.ts

  oracle:
    # The differential oracle's CPython half, re-run against the committed
    # vector. Without this the vector is a fossil: the TypeScript suite would
    # keep agreeing with whatever CPython said on the day somebody generated it.
    #
    # ONE face runs here, not two, and that is the state D-0032 left behind.
    # `dump_config_digest.py` questions CPython -- `json.dumps` under
    # `sort_keys=True` / `ensure_ascii=False`, code-point collation, sha256 --
    # which is a third party that outlived `src/cadenza/` and can still move
    # under a Python upgrade. The compose face questioned cadenza's OWN Python,
    # which no longer exists and therefore can no longer move, so its vector was
    # frozen and its generator deleted; `test/application/compose-oracle.test.ts`
    # still checks all 13 of its cases against that frozen vector on every run.
    #
    # Comparing only `cases` is deliberate -- see the script's --check branch for
    # why the interpreter version is excluded.
    name: oracle vector is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Regenerate and compare
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python scripts/oracle/dump_config_digest.py \
            parity/oracle/config-digest-vector.json --check

  ts-gate:
    # The single stable check name for the TypeScript half, referenced by
    # `.github/branch-protection.json`. It exists so that adding a matrix cell
    # does not require editing the ruleset, and so that a SKIPPED or CANCELLED
    # upstream job fails the gate rather than passing it -- `needs` alone treats
    # a skipped dependency as satisfied.
    name: ts-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [double-green, checks, oracle]
    steps:
      - name: Every upstream job must have succeeded
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          import json, os, sys

          results = json.loads(os.environ["RESULTS"])
          # An allowlist, not a denylist: any result other than `success` --
          # `failure`, `cancelled`, `skipped`, or one GitHub adds later -- is a
          # red gate. `needs` alone would treat a skipped dependency as
          # satisfied, which is the case this job exists to catch.
          bad = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          for name, result in sorted(bad.items()):
              print(f"ts-gate: {name} finished as {result}", file=sys.stderr)
          if bad:
              sys.exit(1)
          print(f"ts-gate: all {len(results)} upstream job(s) succeeded")
