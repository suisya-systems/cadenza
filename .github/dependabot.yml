# Dependabot keeps two surfaces fresh, both on a weekly cadence to bound
# review noise while G2 freeze is in effect (updates arrive as PRs and go
# through the same human review gate as any other change; nothing merges
# on its own):
#   - npm: the TypeScript toolchain. Every version is pinned exactly
#     (.npmrc sets save-exact, DECISIONS.md D-0004), so an update is always a
#     visible diff to package.json and package-lock.json together.
#   - github-actions: the pinned action versions used by the workflows.
#
# The `pip` ecosystem was the third, tracking pyproject.toml. D-0032 deleted
# that manifest, and Dependabot cannot update a file that is not there. Nothing
# replaces it, because nothing needs to: the only Python left in the repository
# is `scripts/oracle/dump_config_digest.py`, which imports the standard library
# and nothing else, and so has no dependency surface to keep fresh.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
