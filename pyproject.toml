[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cadenza"
dynamic = ["version"]
description = "Business operations layer on top of interlock: project registry, delegation contract, and gate management. Provider-agnostic."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "suisya-systems", email = "iwama.ryo.0731@gmail.com" }]
# No "License :: OSI Approved :: MIT License" classifier: PEP 639 forbids
# pairing a license expression with license classifiers, and setuptools>=77
# rejects the combination outright.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# interlock is deliberately absent here, and not as an extra either: its
# control-plane API and SQLite schema are marked throwaway on its own side, so
# depending on them now would turn a spike into a dependency by inertia.
# See docs/design/g1-project-registry.md section 9.
dependencies = [
    'tomli>=2.0; python_version < "3.11"',
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.urls]
Repository = "https://github.com/suisya-systems/cadenza"
Issues = "https://github.com/suisya-systems/cadenza/issues"

[tool.setuptools.dynamic]
version = { attr = "cadenza.__about__.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import order
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF",
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/cadenza"]
mypy_path = "src"

# mypy is pinned to the minimum supported interpreter, so it always models the
# 3.10 branch of the tomllib/tomli import -- but tomli is only *installed* on
# 3.10, so on every other CI row it is an unresolvable name. Ignoring it here
# beats pulling tomli onto interpreters that do not need it at runtime.
[[tool.mypy.overrides]]
module = ["tomli"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
